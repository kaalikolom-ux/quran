<!DOCTYPE html>
<html lang="bn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quran Explorer — Word by Word Quran in Bangla &amp; English | কুরআন অন্বেষা</title>
    <meta name="description" content="শব্দে শব্দে বাংলা অর্থ, ইংরেজি অনুবাদ ও আধুনিক বিজ্ঞানভিত্তিক গবেষণাসহ পবিত্র কুরআন অধ্যয়ন করুন — কুরআন অন্বেষা (Quran Explorer)।" />
    <meta name="keywords" content="কুরআন, শব্দে শব্দে কুরআন, কুরআন অন্বেষা, কুরআনের তাফসির, বাংলা অনুবাদ, Quran Bangla, Word by word Quran, Quran Explorer" />
    <meta name="theme-color" content="#091a1f" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="কুরআন অন্বেষা — শব্দে শব্দে অর্থসহ কুরআন | Quran Explorer" />
    <meta property="og:description" content="শব্দে শব্দে বাংলা অর্থ, ইংরেজি অনুবাদ ও আধুনিক বিজ্ঞানভিত্তিক গবেষণাসহ পবিত্র কুরআন অধ্যয়ন করুন।" />
    <meta property="og:image" content="/images/og-image.jpg" />

    <!-- Favicon & PWA -->
    <link rel="icon" href="/qaf-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Kaushan+Script&family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var p = JSON.parse(localStorage.getItem("quran_explorer_unified_prefs_v1") || "{}");
          var m = p.themeMode || (p.dark === false ? "sepia" : "dark");
          document.documentElement.classList.remove("dark", "theme-sepia", "theme-slate", "theme-light");
          if (m === "dark") {
            document.documentElement.classList.add("dark");
          } else if (m === "sepia") {
            document.documentElement.classList.add("theme-sepia");
          } else if (m === "slate") {
            document.documentElement.classList.add("theme-slate");
          } else if (m === "light") {
            document.documentElement.classList.add("theme-light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-neutral-100 min-h-screen selection:bg-emerald-500 selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
